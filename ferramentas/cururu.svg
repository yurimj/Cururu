<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Ícone do Cururu.
    Desenho propositalmente simples: silhueta fechada, poucos elementos e
    contorno grosso, para continuar legível a 16 px (requisito 27 das premissas).
    Este arquivo é a fonte do ícone; o .ico é gerado a partir dele por
    ferramentas/gerar-icone.
  -->

  <!-- Corpo / cabeça -->
  <ellipse cx="128" cy="158" rx="112" ry="86"
           fill="#5CB947" stroke="#1B5E20" stroke-width="11"/>

  <!-- Bochechas laterais, dão a silhueta larga de sapo -->
  <ellipse cx="30" cy="176" rx="26" ry="34"
           fill="#5CB947" stroke="#1B5E20" stroke-width="11"/>
  <ellipse cx="226" cy="176" rx="26" ry="34"
           fill="#5CB947" stroke="#1B5E20" stroke-width="11"/>

  <!-- Olhos: as duas bolotas no topo são o que identifica o sapo de longe -->
  <circle cx="80" cy="72" r="50" fill="#5CB947" stroke="#1B5E20" stroke-width="11"/>
  <circle cx="176" cy="72" r="50" fill="#5CB947" stroke="#1B5E20" stroke-width="11"/>
  <circle cx="80" cy="68" r="30" fill="#FFFFFF" stroke="#1B5E20" stroke-width="7"/>
  <circle cx="176" cy="68" r="30" fill="#FFFFFF" stroke="#1B5E20" stroke-width="7"/>
  <circle cx="82" cy="72" r="16" fill="#14310F"/>
  <circle cx="178" cy="72" r="16" fill="#14310F"/>

  <!-- Boca: curva larga, o segundo traço mais reconhecível depois dos olhos -->
  <path d="M 56 168 Q 128 226 200 168"
        fill="none" stroke="#1B5E20" stroke-width="13" stroke-linecap="round"/>

  <!-- Narinas -->
  <circle cx="108" cy="130" r="7" fill="#1B5E20"/>
  <circle cx="148" cy="130" r="7" fill="#1B5E20"/>
</svg>
